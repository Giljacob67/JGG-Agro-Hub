<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />
    <title>JGG Group — Hub Agro</title>
    <meta
      name="description"
      content="Estratégia jurídica para o agronegócio, do campo ao mercado. Contratos, regularização, patrimônio, crédito rural, ambiental e contencioso estratégico."
    />
    <meta name="theme-color" content="#205A42" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        var key = "jgg-agro-theme";
        var stored = localStorage.getItem(key);
        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var dark = stored === "dark" || (stored !== "light" && prefersDark);
        if (dark) document.documentElement.classList.add("dark");
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:title" content="JGG Agro — Hub Jurídico" />
    <meta
      property="og:description"
      content="Estratégia jurídica para o agronegócio, do campo ao mercado."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
